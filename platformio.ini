; Watchy 7-SEG firmware — PlatformIO build for SQFMI Watchy (ESP32-PICO-D4)
;
; Hardware revision is selected in lib/Watchy/src/config.h (the
; `#define ARDUINO_WATCHY_V20` line — change to V10/V15 to match your board):
;   V1.0  = DS3231 RTC,  UP button pin 32, battery ADC 33
;   V1.5  = PCF8563 RTC, UP button pin 32, battery ADC 35
;   V2.0  = PCF8563 RTC, UP button pin 35, battery ADC 34   <- default
; The RTC chip itself is auto-detected at runtime, so time/display work on
; any revision; only the UP button and battery-read pins differ.

[env:watchy]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Watchy factory partition layout: 2MB app (no_ota.csv), 1.9MB spiffs
board_build.partitions = no_ota.csv

; Hardware revision is NOT set here — config.h defaults to V2.0 when no board
; define is present. To build for V1.0/V1.5, edit lib/Watchy/src/config.h and
; change the `#define ARDUINO_WATCHY_V20` line (line ~50) to V10/V15. Do NOT add
; -D ARDUINO_WATCHY_Vxx here: the guard in config.h would then skip all the pin
; definitions.

; WiFi credentials and GMT offset come from .env via load_env.py (see
; .env.example). They are only the initial value of the network list on
; first boot. After that the list is stored in NVS and edited on the watch
; via the "Настройка Wi-Fi" menu (up to 5 networks, tried in order).
extra_scripts =
    pre:load_env.py
    pre:lib/Watchy/tools/gen_lang.py

; lang_strings.h is generated into include/ by gen_lang.py; -I makes it
; visible to both the app and the Watchy library
build_flags =
    -I include

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    arduino-libraries/Arduino_JSON@^0.2.0
    arduino-libraries/NTPClient@^3.2.0
    https://github.com/JChristensen/DS3232RTC.git#2.0.1
    https://github.com/PaulStoffregen/Time.git#v1.6.1
    https://github.com/ZinggJM/GxEPD2.git#1.5.6
    https://github.com/orbitalair/Rtc_Pcf8563.git#7e2ece1
    https://github.com/tzapu/WiFiManager.git
